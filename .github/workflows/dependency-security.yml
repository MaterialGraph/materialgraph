name: Dependency Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    name: Locked dependency audit
    runs-on: ubuntu-latest
    container:
      image: python:3.12.3-slim@sha256:fd3817f3a855f6c2ada16ac9468e5ee93e361005bd226fd5a5ee1a504e038c84

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Validate immutable automation references
        run: python scripts/check_automation_pins.py

      - name: Validate dependency contract
        run: python scripts/check_dependency_contract.py

      - name: Install hash-locked audit tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-audit.lock

      - name: Audit production lock
        run: python -m pip_audit --require-hashes --no-deps -r requirements-production.lock

      - name: Build clean production environment
        run: |
          python -m venv /tmp/materialgraph-runtime
          /tmp/materialgraph-runtime/bin/python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            -r requirements-production.lock
          /tmp/materialgraph-runtime/bin/python -m pip check
          /tmp/materialgraph-runtime/bin/python -m pip install \
            --disable-pip-version-check \
            --no-index \
            --no-deps \
            --no-build-isolation \
            -e .
          /tmp/materialgraph-runtime/bin/python \
            scripts/check_dependency_contract.py --check-installed

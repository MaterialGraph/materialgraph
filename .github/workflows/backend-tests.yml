name: Backend Tests

# Runs the complete backend pytest suite against an ephemeral PostgreSQL service
# built only from repository contents: Alembic migrations, the seed scripts and
# the checked-in offline reference dataset. No repository secrets, production
# credentials or external databases are used.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend pytest (ephemeral PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: python:3.12.3-slim@sha256:fd3817f3a855f6c2ada16ac9468e5ee93e361005bd226fd5a5ee1a504e038c84

    services:
      postgres:
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: materialgraph_ci
          POSTGRES_DB: materialgraph_test_ci
          # Ephemeral, job-private service network only; no credential exists.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U materialgraph_ci -d materialgraph_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://materialgraph_ci@postgres:5432/materialgraph_test_ci
      MATERIALGRAPH_ENV_FILE: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate dependency contract
        run: python scripts/check_dependency_contract.py

      - name: Install hash-locked test environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-test.lock
          python -m pip check
          python -m pip install \
            --disable-pip-version-check \
            --no-index \
            --no-deps \
            --no-build-isolation \
            -e .

      - name: Migrate test database
        run: python -m alembic upgrade head

      - name: Load seed and offline reference data
        run: |
          python -m scripts.seed_core_data
          python -m scripts.seed_risk_profiles
          python -m scripts.reference_test_data load
          python -m scripts.seed_material_applications

      - name: Run backend test suite
        run: python -m pytest -q -p no:cacheprovider

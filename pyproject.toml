[project]
name = "materialgraph"
version = "0.1.0"
description = "Graph-based candidate materials intelligence platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy==2.0.50",
    "psycopg[binary]==3.3.4",
    "alembic==1.18.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "networkx==3.6.1",
    "loguru==0.7.3",
    "mp-api==0.46.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff",
]

[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = [
    "alembic*",
    "tests*",
    "scripts*",
    "docs*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
